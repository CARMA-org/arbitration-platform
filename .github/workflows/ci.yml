name: CI

on:
  push:
    branches: [main, "release/**", platform-evaluation]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r experiments/joint_allocation/requirements.txt

      - name: Python tests
        run: python -m pytest tests/python -q

      - name: Java build and tests
        env:
          SOLVER_PYTHON: python
        run: mvn -B test

      - name: Build solver classpath
        run: mvn -B -q dependency:build-classpath -Dmdep.outputFile=cp.txt

      - name: Enforcement smoke
        run: |
          out=$(mktemp -d)
          python experiments/enforcement/run_enforcement.py --smoke --solver-python python --output-dir "$out"

      - name: Dynamic smoke
        run: |
          out=$(mktemp -d)
          python experiments/dynamic_allocation/run_dynamic.py --smoke --output-dir "$out"

      - name: Repository claim scan
        run: python experiments/platform_mediation/claim_scan.py

      - name: Results/documentation consistency
        run: python experiments/platform_mediation/check_consistency.py --with-manifest

      - name: Frozen canonical bundle reproducibility
        run: |
          expected_snapshot="6e98e0c22dd67cd11d3f0921feae23804c1d3bf8"
          expected_sha="1324889bde926fa9624cc499f8f0728d716217f8671c6f97296a9a08988ed484"
          embedded_snapshot="$(unzip -p platform_evaluation_results_bundle.zip REPOSITORY_COMMIT.txt | tr -d '\r\n')"
          test "$embedded_snapshot" = "$expected_snapshot"
          test "$(awk '{print $1}' platform_evaluation_results_bundle.sha256)" = "$expected_sha"
          sha256sum -c platform_evaluation_results_bundle.sha256
          git cat-file -e "${expected_snapshot}^{commit}"
          python experiments/platform_mediation/make_bundle.py --snapshot-commit "$expected_snapshot"
          git diff --exit-code -- platform_evaluation_results_bundle.zip platform_evaluation_results_bundle.sha256
          test "$(awk '{print $1}' platform_evaluation_results_bundle.sha256)" = "$expected_sha"
          sha256sum -c platform_evaluation_results_bundle.sha256
