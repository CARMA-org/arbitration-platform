name: CI

on:
  push:
    branches: [main, "release/**", platform-evaluation]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r experiments/joint_allocation/requirements.txt

      - name: Python tests
        run: python -m pytest tests/python -q

      - name: Java build and tests
        env:
          SOLVER_PYTHON: python
        run: mvn -B test

      - name: Results/documentation consistency
        run: python experiments/platform_mediation/check_consistency.py --with-manifest
