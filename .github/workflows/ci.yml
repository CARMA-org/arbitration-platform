name: CI

on:
  push:
    # `platform-evaluation` is a temporary staging trigger for the consolidation candidate and
    # is removed in the final cleanup commit once the candidate reaches `main`.
    branches: [main, platform-evaluation]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SOLVER_PYTHON: python
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r experiments/joint_allocation/requirements.txt

      # --- build + core suites -------------------------------------------------------------
      - name: Java build and tests
        run: mvn -B test

      - name: Build solver classpath
        run: mvn -B -q dependency:build-classpath -Dmdep.outputFile=cp.txt

      - name: Canonical Python tests
        run: python -m pytest tests/python -q

      - name: Enforcement smoke
        run: |
          out=$(mktemp -d)
          python experiments/enforcement/run_enforcement.py --smoke --solver-python python --output-dir "$out"

      - name: Dynamic smoke
        run: |
          out=$(mktemp -d)
          python experiments/dynamic_allocation/run_dynamic.py --smoke --output-dir "$out"

      - name: Repository claim scan
        run: python experiments/platform_mediation/claim_scan.py

      - name: Canonical results/documentation consistency
        run: python experiments/platform_mediation/check_consistency.py --with-manifest

      - name: Frozen canonical bundle reproducibility
        run: |
          expected_snapshot="6e98e0c22dd67cd11d3f0921feae23804c1d3bf8"
          expected_sha="1324889bde926fa9624cc499f8f0728d716217f8671c6f97296a9a08988ed484"
          embedded_snapshot="$(unzip -p platform_evaluation_results_bundle.zip REPOSITORY_COMMIT.txt | tr -d '\r\n')"
          test "$embedded_snapshot" = "$expected_snapshot"
          test "$(awk '{print $1}' platform_evaluation_results_bundle.sha256)" = "$expected_sha"
          sha256sum -c platform_evaluation_results_bundle.sha256
          git cat-file -e "${expected_snapshot}^{commit}"
          python experiments/platform_mediation/make_bundle.py --snapshot-commit "$expected_snapshot"
          git diff --exit-code -- platform_evaluation_results_bundle.zip platform_evaluation_results_bundle.sha256
          test "$(awk '{print $1}' platform_evaluation_results_bundle.sha256)" = "$expected_sha"
          sha256sum -c platform_evaluation_results_bundle.sha256

      # --- experiment test suites ----------------------------------------------------------
      - name: Heterogeneity experiment tests
        run: python -m pytest experiments/platform_mediation_heterogeneity/tests -q

      - name: Original-question experiment tests
        run: python -m pytest experiments/platform_mediation_original_question/tests -q

      - name: Secondary-completion tests
        run: python -m pytest experiments/platform_mediation_original_question/tests/test_oq_secondary_completion.py -q

      # --- comprehensive independent verification ------------------------------------------
      - name: Final comprehensive independent verifier
        run: |
          out=$(mktemp -d)/VERIFICATION_REPORT_FINAL.json
          python experiments/platform_mediation_original_question/verify_oq_final.py \
            --candidate-rev HEAD --out "$out"
          python -c "import json,sys; r=json.load(open('$out')); print(r['verification_status'], r['n_pass'],'/',r['n_checks']); sys.exit(0 if r['verification_status']=='VERIFIED' and r['n_fail']==0 else 1)"

      # --- manifest verification -----------------------------------------------------------
      - name: Architecture and drift manifest verification
        run: |
          python - <<'PY'
          import importlib.util, os
          root = "experiments/platform_mediation_original_question"
          spec = importlib.util.spec_from_file_location("mkmani", os.path.join(root, "make_oq_manifest.py"))
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          problems = []
          for rel in ("results/architecture_v1/EXPERIMENT_MANIFEST.json", "results/drift_v1/EXPERIMENT_MANIFEST.json"):
              problems += m.verify(os.path.join(root, rel))
          assert not problems, problems
          print("architecture + drift manifests: all hashes match")
          PY

      - name: Correction and final consolidation manifest verification
        run: |
          python experiments/platform_mediation_original_question/make_correction_manifest.py --verify
          python experiments/platform_mediation_original_question/make_final_manifest.py --verify

      # --- deterministic generated-document consistency ------------------------------------
      - name: Deterministic generated-document consistency
        run: |
          # Regenerate only the pure-Python, raw-data-deterministic documents and require
          # byte-identical output. COMPARATOR_AUDIT.md is generated via the Java solver with
          # randomization (not a portable byte-equality target); its integrity is instead
          # covered by the correction-manifest hash check above.
          python experiments/platform_mediation_original_question/make_closure_report.py
          python experiments/platform_mediation_original_question/complete_drift_secondary.py
          git diff --exit-code -- \
            experiments/platform_mediation_original_question/ORIGINAL_QUESTION_CLOSURE.md \
            experiments/platform_mediation_original_question/results/drift_v1/preregistered_secondary_completion

      - name: git diff --check (whitespace / conflict-marker hygiene)
        run: |
          # Check only the consolidation commits (c678a0a..HEAD): the additive verification,
          # documentation, CI and provenance changes. The frozen experimental raw data
          # committed earlier in history is immutable and intentionally excluded (some raw
          # CSV fields contain trailing whitespace and must not be rewritten).
          base="c678a0a96aba563ceff52e4d6b889fb90db316ec"
          if git cat-file -e "${base}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$base" HEAD; then
            echo "checking diff $base..HEAD"
            git diff --check "$base" HEAD
          else
            echo "checking diff HEAD~1..HEAD (consolidation anchor not present)"
            git diff --check HEAD~1 HEAD
          fi
